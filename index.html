<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Ledger — Revenue Operator Mode</title>

<style>
:root{
--bg:#06070a;
--panel:#10131a;
--panel2:#171b25;
--line:#2a3142;
--text:#f6f8fc;
--muted:#a6afc1;
--green:#43e09b;
--red:#ff6b6b;
--blue:#7aa7ff;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial;
}

.container{
max-width:1100px;
margin:auto;
padding:16px;
}

.card{
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
padding:16px;
margin-bottom:14px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
}

.btn{
padding:12px;
border-radius:10px;
border:none;
cursor:pointer;
font-weight:bold;
}

.primary{
background:var(--green);
color:black;
}

.lock{
opacity:.3;
pointer-events:none;
}

.hot{
border:2px solid red;
box-shadow:0 0 10px red;
}

.section{
font-size:12px;
color:var(--muted);
margin-bottom:6px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

</style>
</head>

<body>

<div class="container">

<div class="top">
<h2>Revenue Operator Mode</h2>
<button class="btn primary" onclick="makeMoney()">MAKE MONEY</button>
</div>

<!-- MONEY AT RISK -->
<div class="card">
<div class="section">Money at Risk</div>
<h1 id="risk">$0</h1>
<p id="riskText">No active leads</p>
</div>

<div class="grid">

<!-- LEAD -->
<div class="card" id="leadCard">
<div class="section">Priority Lead</div>
<h2 id="leadName">None</h2>
<p id="leadInfo"></p>
</div>

<!-- NEXT MOVE -->
<div class="card">
<div class="section">Next Move</div>
<h2 id="nextMove">Start by sending DMs</h2>
<p id="nextSub"></p>
</div>

</div>

<!-- ACTIONS -->
<div class="card" id="actions">
<div class="section">Actions</div>
<button onclick="log('DM')">Send DM</button>
<button onclick="log('FollowUp')">Follow Up</button>
<button onclick="log('Ask')">Make Ask</button>
<button onclick="addLead()">Add Lead</button>
</div>

<!-- OPEN LOOPS -->
<div class="card">
<div class="section">Open Loops</div>
<div id="loops"></div>
</div>

<!-- STATUS -->
<div class="card">
<div class="section">Status</div>
<p id="status"></p>
</div>

</div>

<script>

// STATE
let state = {
leads:[],
logs:{DM:0,FollowUp:0,Ask:0}
};

// ADD LEAD
function addLead(){
let name = prompt("Lead name");
if(!name) return;

state.leads.push({
name,
value:47,
stage:"Warm",
signal:2
});

render();
}

// SCORING
function score(l){
let s = l.value;
if(l.stage==="Close Ready") s+=60;
if(l.stage==="Hot") s+=30;
if(l.signal>=4) s+=20;
return s;
}

function bestLead(){
if(state.leads.length===0) return null;
return state.leads.sort((a,b)=>score(b)-score(a))[0];
}

// MONEY
function moneyAtRisk(){
return state.leads.reduce((s,l)=>s+l.value,0);
}

// LOGGING
function log(type){
state.logs[type]++;
render();
}

// MAKE MONEY ENGINE
function makeMoney(){

let lead = bestLead();

if(!lead){
copy("Want me to run a quick audit?");
openLinkedIn();
log("DM");
return;
}

if(lead.stage==="Close Ready" || lead.signal>=4){
copy("Want me to run the $47 audit?");
log("Ask");
}else{
copy("Quick follow-up — still want me to check this?");
log("FollowUp");
}

openLinkedIn();
}

// HELPERS
function copy(t){
navigator.clipboard.writeText(t);
}

function openLinkedIn(){
window.open("https://www.linkedin.com/feed/");
}

// LOGIC
function hasCloseLead(){
return state.leads.some(l=>l.stage==="Close Ready" || l.signal>=4);
}

function nextMove(){

if(state.leads.length===0)
return ["Send DMs now","You have no pipeline"];

if(hasCloseLead() && state.logs.Ask===0)
return ["MAKE THE ASK","Stop avoiding it"];

if(state.logs.FollowUp===0)
return ["Follow up now","You are leaving money"];

return ["Continue execution","Stay in motion"];
}

function isLocked(){
return state.leads.length>0 && state.logs.FollowUp===0;
}

// RENDER
function render(){

// MONEY
let risk = moneyAtRisk();
document.getElementById("risk").innerText="$"+risk;
document.getElementById("riskText").innerText =
risk>0 ? "This disappears if you don’t act" : "No active leads";

// LEAD
let lead = bestLead();
document.getElementById("leadName").innerText = lead?lead.name:"None";
document.getElementById("leadInfo").innerText =
lead?("$"+lead.value+" • "+lead.stage):"";

let card = document.getElementById("leadCard");
card.classList.remove("hot");

if(lead && (lead.stage==="Close Ready" || lead.signal>=4)){
card.classList.add("hot");
}

// NEXT MOVE
let [m,sub] = nextMove();
document.getElementById("nextMove").innerText=m;
document.getElementById("nextSub").innerText=sub;

// LOCK SYSTEM
let actions = document.getElementById("actions");

if(isLocked()){
actions.classList.add("lock");
document.getElementById("nextSub").innerText =
"You are avoiding money. Follow up first.";
}else{
actions.classList.remove("lock");
}

// LOOPS
let loops="";
state.leads.forEach(l=>{
loops+=`<p>${l.name} — open</p>`;
});

document.getElementById("loops").innerHTML =
loops || "No open conversations";

// STATUS
let status="";

if(state.logs.Ask===0){
status="You chose not to make money today";
}else{
status="You are executing";
}

document.getElementById("status").innerText=status;

}

render();

</script>

</body>
</html>
