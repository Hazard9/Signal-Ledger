<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Ledger — Revenue Operator Mode</title>
<style>
body{margin:0;font-family:Arial;background:#05060a;color:#fff}
.container{padding:20px;max-width:900px;margin:auto}
.card{background:#0f1117;border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid #222}
button{padding:14px;border-radius:10px;border:none;cursor:pointer;font-weight:bold}
.primary{background:#43e09b;color:#000;width:100%;font-size:18px}
.lock{opacity:.3;pointer-events:none}
.hot{border:2px solid red;box-shadow:0 0 12px red}
.section-title{font-size:14px;color:#888;margin-bottom:6px;text-transform:uppercase}
</style>
</head>
<body><div class="container"><h2>Revenue Operator Mode</h2><div class="card">
<div class="section-title">Money at Risk</div>
<h1 id="risk">$0</h1>
<p id="riskDetails"></p>
</div><div class="card" id="leadCard">
<div class="section-title">Priority Lead</div>
<h2 id="leadName">No Leads</h2>
<p id="leadMeta"></p>
</div><div class="card">
<div class="section-title">Next Move</div>
<h2 id="nextMove">Create signal</h2>
<p id="nextText"></p>
</div><button class="primary" onclick="makeMoney()">MAKE MONEY</button>

<div class="card">
<div class="section-title">Actions</div>
<button onclick="log('DM')">Send DM</button>
<button onclick="log('FollowUp')">Follow Up</button>
<button onclick="log('Ask')">Make Ask</button>
<button onclick="addLead()">Add Lead</button>
</div><div class="card">
<div class="section-title">Open Loops</div>
<div id="loops"></div>
</div><div class="card">
<div class="section-title">Status</div>
<p id="status"></p>
</div></div><script>
let state={
leads:[],
logs:{DM:0,FollowUp:0,Ask:0}
}

function addLead(){
let name=prompt("Lead name")
if(!name) return
state.leads.push({name,value:47,last:0,stage:"warm"})
render()
}

function bestLead(){
if(state.leads.length===0) return null
return state.leads.sort((a,b)=>b.value-a.value)[0]
}

function risk(){
return state.leads.reduce((t,l)=>t+l.value,0)
}

function log(type){
state.logs[type]++
render()
}

function makeMoney(){
let lead=bestLead()
if(!lead){
alert("No leads. Send DM first.")
return
}
navigator.clipboard.writeText("Want me to run a quick audit?")
window.open("https://www.linkedin.com/feed/")
state.logs.Ask++
render()
}

function nextMove(){
if(state.leads.length===0) return "Send DMs"
if(state.logs.Ask===0) return "Make the ask"
return "Continue follow-ups"
}

function render(){
document.getElementById("risk").innerText="$"+risk()
document.getElementById("riskDetails").innerText=state.leads.length+" leads open"

let lead=bestLead()
document.getElementById("leadName").innerText=lead?lead.name:"None"
document.getElementById("leadMeta").innerText=lead?"$"+lead.value:""

let move=nextMove()
document.getElementById("nextMove").innerText=move

let loops=""
state.leads.forEach(l=>{
loops+=`<p>${l.name} — open</p>`
})
document.getElementById("loops").innerHTML=loops||"No open loops"

let status=""
if(state.logs.Ask===0) status="You have not tried to make money today"
else status="You are executing"

document.getElementById("status").innerText=status
}

render()
</script></body>
</html>
